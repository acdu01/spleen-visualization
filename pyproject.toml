[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spleen-visualization"
version = "0.1.0"
description = "Explore CT geometry and the cost of coarser spleen representations."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "nibabel>=5.2,<6", "matplotlib>=3.8,<4",
  "streamlit>=1.67,<2", "requests>=2.31,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
spleen = "ct_poc.cli:main"

[tool.setuptools.packages.find]
include = ["ct_poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
